# Referral codes shown on /refer/
#
# Each entry:
#   name             - service/product name
#   category         - short label shown as the card eyebrow (e.g. "FINANCE")
#   description      - one or two sentences on what it is (always visible)
#   long_description - optional, longer write-up shown behind a "Read more"
#                       toggle. Genuinely visible if clicked (not hidden from
#                       users) — good for SEO without doing anything shady.
#                       Omit this key entirely if you don't want one.
#   reward           - what the reader gets for using it (be specific)
#   link             - the URL the "Use this" button opens
#   placeholder      - true hides nothing but adds a visible "placeholder"
#                       flag on the card so it's obvious which entries are real
#
# Click tracking: link a service like Dub.co or Bitly (both have free
# tiers) to your own domain, create a short link there for each real
# referral URL, and paste that short link into `link` below instead of
# the raw URL. Their dashboard will then show clicks per code. Until
# you've done that, `link` should just be the raw referral URL — it
# still works, you just won't see click counts.

- name: Capital One Savor Card
  category: FINANCE
  description: A good card for all things food — 3% back on groceries and meals out, with no annual fee.
  long_description: >-
    The Capital One Savor Card is built around how most people actually
    spend: groceries and eating out. It earns 3% cash back on both,
    year-round, not just in a rotating bonus category you have to
    remember to activate. There's no annual fee, so the rewards are
    straightforward upside rather than something you have to spend your
    way past a fee to justify. If you're comparing cash-back cards for
    food spending and don't want to deal with category caps or an annual
    fee, it's worth a look. Applying through a referral link like this
    one doesn't cost you anything extra — it's the same application,
    same terms, same card.
  reward: Bonus cash back after you're approved and meet the spending requirement
  link: https://i.capitalone.com/JcOsiK5rz
  placeholder: false
